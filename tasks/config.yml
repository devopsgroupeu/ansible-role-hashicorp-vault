---
# ==============================================================================
# Config: dirs, perms, vault.env, vault.hcl, vault.service, swap, selinux
# ==============================================================================

# In --limit / serial runs, peers outside the batch have no facts. Without them
# the retry_join addresses below and the certificate SANs in tls_generate.yml
# would fall back to hostnames and drop IP SANs, rewriting vault.hcl and
# restarting Vault. Gather network facts for every inventory peer that lacks
# them. Peers that are not in the inventory keep the hostname fallback.
# A peer that is down must not abort the play for every host with an error
# blamed on the run_once host. Probe the peers first and gather only from the
# reachable ones: one unreachable item fails the whole delegated loop, and
# Ansible then drops the facts of every item. The assert below names the
# unreachable peers. ignore_errors is needed on top of ignore_unreachable,
# because a run_once loop with an unreachable item otherwise ends the play.
- name: Probe peers missing network facts
  ansible.builtin.ping:
  delegate_to: "{{ item }}"
  run_once: true
  ignore_unreachable: true
  ignore_errors: true
  register: __vault_peer_probe
  loop: "{{ vault_raft_peers | select('in', groups['all']) | list }}"
  when:
    - not vault_config_only | bool
    - "'default_ipv4' not in (hostvars[item]['ansible_facts'] | default({}))"
  tags: config

- name: Gather network facts for reachable peers missing them
  ansible.builtin.setup:
    gather_subset:
      - network
  delegate_to: "{{ item }}"
  delegate_facts: true
  run_once: true
  # Only peers that answered the probe (skipped and unreachable items have no
  # ping key).
  loop: >-
    {{ __vault_peer_probe['results'] | default([])
       | selectattr('ping', 'defined') | map(attribute='item') | list }}
  when: not vault_config_only | bool
  tags: config

# An inventory peer still without facts is unreachable. Its hostname fallback
# would rewrite vault.hcl and the certificates and restart Vault on every
# reachable node, so stop unless vault_allow_unreachable_peers accepts that
# (for example to re-unseal the surviving nodes of a degraded cluster).
- name: Assert every inventory peer was reachable for network facts
  ansible.builtin.assert:
    that:
      - __vault_unreachable_peers | length == 0
    fail_msg: >-
      Raft peer(s) {{ __vault_unreachable_peers | join(', ') }} could not be
      reached to gather network facts. Without them their retry_join address
      falls back to the inventory hostname and their IP SAN is dropped, which
      rewrites vault.hcl and the certificates and restarts Vault on the
      reachable nodes. Bring the peer(s) back, or set
      vault_allow_unreachable_peers to true to continue with that fallback.
    quiet: true
  vars:
    __vault_unreachable_peers: >-
      {%- set missing = [] -%}
      {%- for peer in vault_raft_peers
            if peer in groups['all']
            and 'default_ipv4' not in (hostvars[peer]['ansible_facts'] | default({})) -%}
        {%- set _ = missing.append(peer) -%}
      {%- endfor -%}
      {{ missing }}
  run_once: true
  when:
    - not vault_config_only | bool
    - not (vault_allow_unreachable_peers | bool)
  tags: config

# Build __vault_retry_join_peers: list of {addr: <ip|hostname>} for every peer
# except the current host. Falls back to the peer inventory name when
# ansible_facts['default_ipv4']['address'] is not yet gathered (e.g. render-only mode).
- name: Compute __vault_retry_join_peers (peers minus self, address-resolved)
  ansible.builtin.set_fact:
    __vault_retry_join_peers: >-
      {%- set peers = [] -%}
      {%- for peer in vault_raft_peers -%}
        {%- if peer != inventory_hostname -%}
          {%- if hostvars[peer] is defined
                 and 'default_ipv4' in hostvars[peer]['ansible_facts'] | default({})
                 and hostvars[peer]['ansible_facts']['default_ipv4'] is mapping
                 and 'address' in hostvars[peer]['ansible_facts']['default_ipv4'] -%}
            {%- set addr = hostvars[peer]['ansible_facts']['default_ipv4']['address'] -%}
          {%- else -%}
            {%- set addr = peer -%}
          {%- endif -%}
          {%- set _ = peers.append({'addr': addr}) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ peers }}
  tags: config

# ==============================================================================
# Directories
# ==============================================================================

- name: Create Vault directories
  ansible.builtin.file:
    path: "{{ item['path'] }}"
    state: directory
    owner: "{{ item['owner'] }}"
    group: "{{ item['group'] }}"
    mode: "{{ item['mode'] }}"
  loop:
    - path: "{{ vault_config_dir }}"
      owner: "{{ vault_user }}"
      group: "{{ vault_group }}"
      mode: "{{ vault_config_dir_mode }}"
    - path: "{{ vault_data_dir }}"
      owner: "{{ vault_user }}"
      group: "{{ vault_group }}"
      mode: "{{ vault_data_dir_mode }}"
    - path: "{{ vault_tls_dir }}"
      owner: root
      group: "{{ vault_group }}"
      mode: "0750"
    - path: "{{ vault_audit_dir }}"
      owner: "{{ vault_user }}"
      group: "{{ vault_group }}"
      mode: "0750"
  loop_control:
    label: "{{ item['path'] }}"
  tags: config

# ==============================================================================
# vault.env - must exist before vault.hcl or the systemd unit fails to start.
# Rendered first so daemon-reload picks it up correctly.
# ==============================================================================

- name: Render vault.env
  ansible.builtin.template:
    src: vault.env.j2
    dest: "{{ vault_config_dir }}/vault.env"
    owner: "{{ vault_user }}"
    group: "{{ vault_group }}"
    mode: "{{ vault_config_file_mode }}"
  no_log: true
  notify:
    - reload systemd daemon
    - restart vault
  tags: config

# ==============================================================================
# vault.hcl
# ==============================================================================

- name: Render vault.hcl
  ansible.builtin.template:
    src: vault.hcl.j2
    dest: "{{ vault_config_dir }}/vault.hcl"
    owner: "{{ vault_user }}"
    group: "{{ vault_group }}"
    mode: "{{ vault_config_file_mode }}"
    backup: true
  notify:
    - reload systemd daemon
    - restart vault
  tags: config

# ==============================================================================
# vault.service
# ==============================================================================

- name: Render vault.service systemd unit
  ansible.builtin.template:
    src: vault.service.j2
    dest: /etc/systemd/system/vault.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd daemon
    - restart vault
  tags: config

# ==============================================================================
# Swap management (compensate for disable_mlock=true)
# Not run in render-only mode (vault_config_only=true).
# ==============================================================================

- name: Disable swap immediately
  ansible.builtin.command: swapoff -a
  # Only run when swap is actually active. swapoff -a returns rc 0 even when no
  # swap is on, so an unconditional run would report changed every time and
  # break idempotence on VMs with swap.
  changed_when: true
  when:
    - vault_manage_swap | bool
    - not vault_config_only | bool
    - ansible_facts['swaptotal_mb'] | default(0) | int > 0
  tags: config

- name: Comment out swap entries from /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    # Match any uncommented line whose third whitespace-delimited field is 'swap'.
    # Covers both Debian (sw options) and RHEL (defaults options) fstab swap
    # entries. The first field must not start with '#', so already commented
    # lines are left alone, and only [ \t] separates fields: \s would also
    # match newlines (the module uses re.MULTILINE) and join a blank line to
    # the next entry.
    regexp: '^([ \t]*[^#\s]\S*[ \t]+\S+[ \t]+swap[ \t]+.*)$'
    replace: '# \1'
    backup: true
  when:
    - vault_manage_swap | bool
    - not vault_config_only | bool
  tags: config

# ==============================================================================
# SELinux context restore (RHEL-family only)
# Not run in render-only mode (vault_config_only=true).
# ==============================================================================

- name: Restore SELinux context on Vault directories
  ansible.builtin.command: restorecon -R "{{ item }}"
  loop:
    - "{{ vault_config_dir }}"
    - "{{ vault_data_dir }}"
    - "{{ vault_tls_dir }}"
    - "{{ vault_audit_dir }}"
  loop_control:
    label: "{{ item }}"
  when:
    - vault_manage_selinux | bool
    - ansible_facts['os_family'] == 'RedHat'
    - not vault_config_only | bool
  changed_when: false
  tags: config
