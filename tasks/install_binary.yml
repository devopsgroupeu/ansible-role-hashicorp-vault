---
# ==============================================================================
# Install Vault from a GPG-verified binary zip (air-gapped / version-pinned)
# ==============================================================================

# --- Prerequisites ------------------------------------------------------------
# A clean host may lack gpg (signature check) and unzip (unarchive).

- name: Install binary install prerequisites (Debian/Ubuntu)
  ansible.builtin.apt:
    name: "{{ __vault_binary_deps['Debian'] }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == 'Debian'
  tags: install

- name: Install binary install prerequisites (RHEL/EL)
  ansible.builtin.dnf:
    name: "{{ __vault_binary_deps['RedHat'] }}"
    state: present
  when: ansible_facts['os_family'] == 'RedHat'
  tags: install

# --- Create vault system group and user (binary path only) --------------------

- name: Create vault system group
  ansible.builtin.group:
    name: "{{ vault_group }}"
    system: true
    state: present
  tags: install

- name: Create vault system user
  ansible.builtin.user:
    name: "{{ vault_user }}"
    group: "{{ vault_group }}"
    system: true
    shell: /sbin/nologin
    create_home: false
    home: /opt/vault
    state: present
  tags: install

# --- Idempotency: skip everything below when the version is installed --------

- name: Check current installed binary version
  ansible.builtin.command: "{{ vault_bin_path }} version"
  register: __vault_installed_version
  check_mode: false
  changed_when: false
  failed_when: false
  tags: install

- name: Download, verify and install the Vault binary
  when: >-
    __vault_installed_version['rc'] != 0 or
    vault_version not in __vault_installed_version['stdout']
  tags: install
  block:
    # Build the canonical download filename once so all tasks below stay DRY.
    - name: Set binary download facts
      ansible.builtin.set_fact:
        __vault_zip_name: "vault_{{ vault_version }}_linux_{{ vault_arch }}.zip"
        __vault_tmpdir: "/tmp/vault-install-{{ vault_version }}"

    - name: Create temporary download directory
      ansible.builtin.file:
        path: "{{ __vault_tmpdir }}"
        state: directory
        mode: "0700"

    # Fetch the artefacts in sequence; get_url is idempotent (checksum guard).
    - name: Download Vault binary zip
      ansible.builtin.get_url:
        url: "{{ vault_binary_base_url }}/{{ vault_version }}/{{ __vault_zip_name }}"
        dest: "{{ __vault_tmpdir }}/{{ __vault_zip_name }}"
        mode: "0600"
        force: false

    - name: Download Vault SHA256SUMS
      ansible.builtin.get_url:
        url: "{{ vault_binary_base_url }}/{{ vault_version }}/vault_{{ vault_version }}_SHA256SUMS"
        dest: "{{ __vault_tmpdir }}/vault_{{ vault_version }}_SHA256SUMS"
        mode: "0600"
        force: false

    - name: Download Vault SHA256SUMS.sig
      ansible.builtin.get_url:
        url: "{{ vault_binary_base_url }}/{{ vault_version }}/vault_{{ vault_version }}_SHA256SUMS.sig"
        dest: "{{ __vault_tmpdir }}/vault_{{ vault_version }}_SHA256SUMS.sig"
        mode: "0600"
        force: false
      when: vault_binary_verify_gpg | bool

    - name: Download HashiCorp PGP public key
      ansible.builtin.get_url:
        url: "{{ vault_binary_gpg_key_url }}"
        dest: "{{ __vault_tmpdir }}/hashicorp.pgp"
        mode: "0600"
        force: false
      when: vault_binary_verify_gpg | bool

    - name: Import HashiCorp PGP key into ephemeral keyring
      ansible.builtin.command: >-
        gpg --batch --no-default-keyring
        --keyring {{ __vault_tmpdir }}/hashicorp.gpg
        --import {{ __vault_tmpdir }}/hashicorp.pgp
      changed_when: false
      when: vault_binary_verify_gpg | bool

    - name: Verify SHA256SUMS signature
      ansible.builtin.command: >-
        gpg --batch --status-fd 1 --no-default-keyring
        --keyring {{ __vault_tmpdir }}/hashicorp.gpg
        --verify {{ __vault_tmpdir }}/vault_{{ vault_version }}_SHA256SUMS.sig
        {{ __vault_tmpdir }}/vault_{{ vault_version }}_SHA256SUMS
      register: __vault_gpg_verify
      changed_when: false
      when: vault_binary_verify_gpg | bool

    # The key is fetched at run time, so a good signature alone only proves
    # that SHA256SUMS matches whatever key was downloaded. Pin the signer: the
    # last field of a VALIDSIG status line is the primary key fingerprint.
    - name: Assert SHA256SUMS is signed by the pinned HashiCorp key
      ansible.builtin.assert:
        that:
          - (vault_binary_gpg_fingerprint | replace(' ', '') | upper) in __vault_gpg_validsig_fprs
        fail_msg: >-
          SHA256SUMS for Vault {{ vault_version }} is not signed by the pinned
          key {{ vault_binary_gpg_fingerprint }} (signed by:
          {{ __vault_gpg_validsig_fprs | join(', ') | default('none', true) }}).
          Refusing to install. Check vault_binary_gpg_key_url and
          vault_binary_gpg_fingerprint.
        quiet: true
      vars:
        __vault_gpg_validsig_fprs: >-
          {{ __vault_gpg_verify['stdout_lines']
             | select('match', '^.GNUPG:. VALIDSIG ')
             | map('split') | map('last') | map('upper') | list }}
      when: vault_binary_verify_gpg | bool

    # Verify the zip checksum against the signed SHA256SUMS file.
    # SHA256SUMS lists every platform's zip, but only this architecture's zip
    # was downloaded. We therefore (a) assert the downloaded zip is present so a
    # missing zip fails closed, then (b) run sha256sum with --ignore-missing so
    # the verify checks our present file while skipping the absent
    # other-platform entries.
    - name: Stat downloaded Vault zip before checksum verification
      ansible.builtin.stat:
        path: "{{ __vault_tmpdir }}/{{ __vault_zip_name }}"
      register: __vault_zip_stat

    - name: Assert downloaded Vault zip exists
      ansible.builtin.assert:
        that:
          - __vault_zip_stat['stat']['exists'] | bool
        fail_msg: >-
          Downloaded Vault zip {{ __vault_zip_name }} is missing from
          {{ __vault_tmpdir }}; cannot verify checksum.
        quiet: true

    - name: Verify zip checksum matches SHA256SUMS
      ansible.builtin.command: >-
        sha256sum --ignore-missing -c
        {{ __vault_tmpdir }}/vault_{{ vault_version }}_SHA256SUMS
      args:
        chdir: "{{ __vault_tmpdir }}"
      changed_when: false

    - name: Extract Vault binary to /usr/local/bin
      ansible.builtin.unarchive:
        src: "{{ __vault_tmpdir }}/{{ __vault_zip_name }}"
        dest: /usr/local/bin
        remote_src: true
        include:
          - vault
        mode: "0755"
        owner: root
        group: root
      notify:
        - reload systemd daemon
        - restart vault

  always:
    - name: Remove temporary download directory
      ansible.builtin.file:
        path: "{{ __vault_tmpdir }}"
        state: absent
      when: __vault_tmpdir is defined
