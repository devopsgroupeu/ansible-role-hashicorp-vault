---
# binary scenario - single node with vault_install_method: binary on a clean
# image (no gpg, no unzip). converge and idempotence prove the prerequisites
# are installed and a second run downloads nothing; the side effect proves a
# signature from a key other than vault_binary_gpg_fingerprint is rejected.

dependency:
  name: galaxy

driver:
  name: docker

platforms:
  - name: hashicorp-vault-binary
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian12}-ansible:latest"
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: ""
    groups:
      - vault

provisioner:
  name: ansible
  playbooks:
    side_effect: side_effect_wrong_fingerprint.yml
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
  config_options:
    defaults:
      interpreter_python: auto_silent
      callbacks_enabled: profile_tasks, timer
      stdout_callback: default
    ssh_connection:
      pipelining: false
  inventory:
    hosts:
      all:
        vars:
          ansible_user: root

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - side_effect side_effect_wrong_fingerprint.yml
    - verify
    - cleanup
    - destroy
