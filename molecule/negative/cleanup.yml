---
# Remove the controller-side files (init file, backups, test inputs) so the
# next run starts clean.
- name: Cleanup negative scenario controller files
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Find controller files of the negative scenario
      ansible.builtin.find:
        paths: /tmp
        patterns: ".vault_init_molecule_negative*"
        hidden: true
      register: __cleanup_files

    - name: Remove controller files of the negative scenario
      ansible.builtin.file:
        path: "{{ item['path'] }}"
        state: absent
      loop: "{{ __cleanup_files['files'] }}"
      loop_control:
        label: "{{ item['path'] }}"
