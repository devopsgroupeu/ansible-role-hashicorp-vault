---
# Cases for the negative scenario, run in order against one container.
# Shared role variables live in molecule.yml (inventory group_vars).

# ------------------------------------------------------------------------------
# Case 0: install and start Vault, but do not initialize it.
# ------------------------------------------------------------------------------
- name: Case 0 - install Vault without init
  hosts: all
  become: true
  gather_facts: true
  vars:
    vault_init: false
    vault_unseal: false
  tasks:
    - name: Include hashicorp_vault role
      ansible.builtin.include_role:
        name: ansible-role-hashicorp-vault

# ------------------------------------------------------------------------------
# Case 1 (V-09): an unreachable Vault (service stopped) must fail the status
# probe with the CLI error visible, and must never be read as "not
# initialized" (which would run vault operator init).
# ------------------------------------------------------------------------------
- name: Case 1 - status probe errors fail instead of reading as uninitialized
  hosts: all
  become: true
  gather_facts: false
  vars:
    vault_init: true
    vault_unseal: true
    vault_service_state: stopped
  tasks:
    - name: Run the role and capture the failure
      block:
        - name: Include hashicorp_vault role
          ansible.builtin.include_role:
            name: ansible-role-hashicorp-vault

        - name: Fail when the role did not fail
          ansible.builtin.fail:
            msg: "The role passed although Vault was unreachable"
      rescue:
        - name: Assert the status probe failed with readable stderr
          ansible.builtin.assert:
            that:
              - ansible_failed_task['name'] == 'Probe Vault status on every node'
              - ansible_failed_result['rc'] == 1
              - ansible_failed_result['stderr'] | length > 0
              - "'censored' not in ansible_failed_result"
            fail_msg: "Unexpected failure: {{ ansible_failed_task['name'] }}"

    - name: Start Vault again
      ansible.builtin.systemd:
        name: vault
        state: started

    - name: Query Vault status
      ansible.builtin.command: vault status -format=json
      environment:
        VAULT_ADDR: "https://127.0.0.1:8200"
        VAULT_CACERT: /opt/vault/tls/vault-ca.pem
      register: __case_status
      changed_when: false
      until: __case_status['rc'] == 2
      failed_when: __case_status['rc'] != 2
      retries: 6
      delay: 5

    - name: Assert Vault was not initialized
      ansible.builtin.assert:
        that:
          - not ((__case_status['stdout'] | from_json)['initialized'] | bool)

# ------------------------------------------------------------------------------
# Case 2 (V-06): vault_unseal=false on a fresh node finishes quickly and leaves
# Vault initialized and sealed, with the init file saved on the controller.
# ------------------------------------------------------------------------------
- name: Case 2 - vault_unseal false completes and leaves Vault sealed
  hosts: all
  become: true
  gather_facts: false
  vars:
    vault_init: true
    vault_unseal: false
  tasks:
    - name: Record start time
      ansible.builtin.set_fact:
        __case_start: "{{ lookup('ansible.builtin.pipe', 'date +%s') }}"

    - name: Include hashicorp_vault role
      ansible.builtin.include_role:
        name: ansible-role-hashicorp-vault

    - name: Assert the run did not wait for an unseal
      ansible.builtin.assert:
        that:
          - (lookup('ansible.builtin.pipe', 'date +%s') | int) - (__case_start | int) < 60
        fail_msg: "vault_unseal=false run took 60 s or more; it waited for an unseal"

    - name: Query Vault status
      ansible.builtin.command: vault status -format=json
      environment:
        VAULT_ADDR: "https://127.0.0.1:8200"
        VAULT_CACERT: /opt/vault/tls/vault-ca.pem
      register: __case_status
      changed_when: false
      failed_when: __case_status['rc'] != 2

    - name: Stat controller init file
      ansible.builtin.stat:
        path: /tmp/.vault_init_molecule_negative.json
      delegate_to: localhost
      become: false
      register: __case_init_file

    - name: Assert Vault is initialized, sealed and the init file exists
      ansible.builtin.assert:
        that:
          - (__case_status['stdout'] | from_json)['initialized'] | bool
          - (__case_status['stdout'] | from_json)['sealed'] | bool
          - __case_init_file['stat']['exists']

# ------------------------------------------------------------------------------
# Case 3 (V-04): a leader that never reaches unsealed must fail the wait gate.
# Init used threshold 2; submitting only 1 share is accepted by the unseal API
# but leaves Vault sealed.
# ------------------------------------------------------------------------------
- name: Case 3 - never-unsealing leader fails the wait gate
  hosts: all
  become: true
  gather_facts: false
  vars:
    vault_init: true
    vault_unseal: true
    vault_init_key_threshold: 1
  tasks:
    - name: Run the role and capture the failure
      block:
        - name: Include hashicorp_vault role
          ansible.builtin.include_role:
            name: ansible-role-hashicorp-vault

        - name: Fail when the role did not fail
          ansible.builtin.fail:
            msg: "The role passed although the leader stayed sealed"
      rescue:
        - name: Assert the leader wait gate failed
          ansible.builtin.assert:
            that:
              - ansible_failed_task['name'] == 'Wait for leader to report unsealed status (Shamir)'
            fail_msg: "Unexpected failed task: {{ ansible_failed_task['name'] }}"

# ------------------------------------------------------------------------------
# Case 4 (V-03): a fresh node must not be initialized over an existing
# controller init file (another cluster's root token and keys).
# ------------------------------------------------------------------------------
- name: Case 4 - existing controller init file blocks a fresh init
  hosts: all
  become: true
  gather_facts: false
  vars:
    vault_init: true
    vault_unseal: true
  tasks:
    - name: Reset to a fresh Vault
      ansible.builtin.include_tasks: tasks/reset_vault.yml

    - name: Write a dummy init file of another cluster
      ansible.builtin.copy:
        content: '{"root_token": "other-cluster", "unseal_keys_hex": []}'
        dest: /tmp/.vault_init_molecule_negative.json
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: Stat the dummy init file
      ansible.builtin.stat:
        path: /tmp/.vault_init_molecule_negative.json
        checksum_algorithm: sha256
      delegate_to: localhost
      become: false
      register: __case_dummy_before

    - name: Run the role and capture the failure
      block:
        - name: Include hashicorp_vault role
          ansible.builtin.include_role:
            name: ansible-role-hashicorp-vault

        - name: Fail when the role did not fail
          ansible.builtin.fail:
            msg: "The role passed although an init file already existed"
      rescue:
        - name: Assert the init file guard fired
          ansible.builtin.assert:
            that:
              - ansible_failed_task['name'] == 'Refuse to overwrite an existing controller init file'
            fail_msg: "Unexpected failed task: {{ ansible_failed_task['name'] }}"

    - name: Query Vault status
      ansible.builtin.command: vault status -format=json
      environment:
        VAULT_ADDR: "https://127.0.0.1:8200"
        VAULT_CACERT: /opt/vault/tls/vault-ca.pem
      register: __case_status
      changed_when: false
      failed_when: __case_status['rc'] != 2

    - name: Stat the dummy init file again
      ansible.builtin.stat:
        path: /tmp/.vault_init_molecule_negative.json
        checksum_algorithm: sha256
      delegate_to: localhost
      become: false
      register: __case_dummy_after

    - name: Assert Vault stayed uninitialized and the file is untouched
      ansible.builtin.assert:
        that:
          - not ((__case_status['stdout'] | from_json)['initialized'] | bool)
          - __case_dummy_after['stat']['checksum'] == __case_dummy_before['stat']['checksum']

    - name: Remove the dummy init file
      ansible.builtin.file:
        path: /tmp/.vault_init_molecule_negative.json
        state: absent
      delegate_to: localhost
      become: false

# ------------------------------------------------------------------------------
# Case 5 (V-18): encryption requested with a missing password file must fail
# in validate, before init writes any key material.
# ------------------------------------------------------------------------------
- name: Case 5 - missing encryption password file fails before init
  hosts: all
  become: true
  gather_facts: false
  vars:
    vault_init: true
    vault_unseal: true
    vault_init_encrypt_output: true
    vault_init_encrypt_password_file: /tmp/.vault_init_molecule_negative_missing_pass
  tasks:
    - name: Reset to a fresh Vault
      ansible.builtin.include_tasks: tasks/reset_vault.yml

    - name: Run the role and capture the failure
      block:
        - name: Include hashicorp_vault role
          ansible.builtin.include_role:
            name: ansible-role-hashicorp-vault

        - name: Fail when the role did not fail
          ansible.builtin.fail:
            msg: "The role passed although the password file is missing"
      rescue:
        - name: Assert the validate check fired
          ansible.builtin.assert:
            that:
              - ansible_failed_task['name'] == 'Validate init output encryption password file and output directory'
            fail_msg: "Unexpected failed task: {{ ansible_failed_task['name'] }}"

    - name: Query Vault status
      ansible.builtin.command: vault status -format=json
      environment:
        VAULT_ADDR: "https://127.0.0.1:8200"
        VAULT_CACERT: /opt/vault/tls/vault-ca.pem
      register: __case_status
      changed_when: false
      failed_when: __case_status['rc'] != 2

    - name: Stat controller init file
      ansible.builtin.stat:
        path: /tmp/.vault_init_molecule_negative.json
      delegate_to: localhost
      become: false
      register: __case_init_file

    - name: Assert Vault stayed uninitialized and no init file was written
      ansible.builtin.assert:
        that:
          - not ((__case_status['stdout'] | from_json)['initialized'] | bool)
          - not __case_init_file['stat']['exists']

# ------------------------------------------------------------------------------
# Case 6 (V-18 positive): with a password file the init file is written
# ansible-vault encrypted, and a later run with --vault-password-file
# re-unseals Vault after a restart from that encrypted file.
# ------------------------------------------------------------------------------
- name: Case 6 - encrypted init file and re-unseal from it
  hosts: all
  become: true
  gather_facts: false
  vars:
    __case_pass_file: /tmp/.vault_init_molecule_negative_pass
    vault_init: true
    vault_unseal: true
    vault_init_encrypt_output: true
    vault_init_encrypt_password_file: "{{ __case_pass_file }}"
  tasks:
    - name: Reset to a fresh Vault
      ansible.builtin.include_tasks: tasks/reset_vault.yml

    - name: Create a throwaway ansible-vault password file on the controller
      ansible.builtin.copy:
        content: "molecule-negative-{{ 999999 | random(seed=inventory_hostname) }}\n"
        dest: "{{ __case_pass_file }}"
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: Include hashicorp_vault role
      ansible.builtin.include_role:
        name: ansible-role-hashicorp-vault

    - name: Read the init file header
      ansible.builtin.command: head -c 14 /tmp/.vault_init_molecule_negative.json
      delegate_to: localhost
      become: false
      register: __case_header
      changed_when: false

    - name: Assert the init file is ansible-vault encrypted
      ansible.builtin.assert:
        that:
          - __case_header['stdout'] == '$ANSIBLE_VAULT'

    - name: Restart Vault so it comes back sealed
      ansible.builtin.systemd:
        name: vault
        state: restarted

    - name: Re-run the role with the vault password file
      ansible.builtin.command:
        argv:
          - ansible-playbook
          - --inventory
          - "{{ lookup('ansible.builtin.env', 'MOLECULE_INVENTORY_FILE') | dirname }}"
          - "{{ lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_DIRECTORY') }}/converge_role.yml"
          - --vault-password-file
          - "{{ __case_pass_file }}"
          - --extra-vars
          - "{{ {'vault_init_encrypt_output': true, 'vault_init_encrypt_password_file': __case_pass_file} | to_json }}"
      environment:
        ANSIBLE_NOCOLOR: "1"
        ANSIBLE_FORCE_COLOR: "0"
      delegate_to: localhost
      become: false
      register: __case_rerun
      changed_when: false
      failed_when: __case_rerun['rc'] != 0

    - name: Query Vault status
      ansible.builtin.command: vault status -format=json
      environment:
        VAULT_ADDR: "https://127.0.0.1:8200"
        VAULT_CACERT: /opt/vault/tls/vault-ca.pem
      register: __case_status
      changed_when: false
      failed_when: __case_status['rc'] != 0

    - name: Assert Vault is unsealed again
      ansible.builtin.assert:
        that:
          - not ((__case_status['stdout'] | from_json)['sealed'] | bool)
