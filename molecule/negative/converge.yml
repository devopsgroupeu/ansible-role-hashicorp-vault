---
# Cases for the negative scenario, run in order against one container.
# Shared role variables live in molecule.yml (inventory group_vars).

# ------------------------------------------------------------------------------
# Case 0: install and start Vault, but do not initialize it.
# ------------------------------------------------------------------------------
- name: Case 0 - install Vault without init
  hosts: all
  become: true
  gather_facts: true
  vars:
    vault_init: false
    vault_unseal: false
  tasks:
    - name: Include hashicorp_vault role
      ansible.builtin.include_role:
        name: ansible-role-hashicorp-vault

# ------------------------------------------------------------------------------
# Case 1 (V-06): vault_unseal=false on a fresh node finishes quickly and leaves
# Vault initialized and sealed, with the init file saved on the controller.
# ------------------------------------------------------------------------------
- name: Case 1 - vault_unseal false completes and leaves Vault sealed
  hosts: all
  become: true
  gather_facts: false
  vars:
    vault_init: true
    vault_unseal: false
  tasks:
    - name: Record start time
      ansible.builtin.set_fact:
        __case_start: "{{ lookup('ansible.builtin.pipe', 'date +%s') }}"

    - name: Include hashicorp_vault role
      ansible.builtin.include_role:
        name: ansible-role-hashicorp-vault

    - name: Assert the run did not wait for an unseal
      ansible.builtin.assert:
        that:
          - (lookup('ansible.builtin.pipe', 'date +%s') | int) - (__case_start | int) < 60
        fail_msg: "vault_unseal=false run took 60 s or more; it waited for an unseal"

    - name: Query Vault status
      ansible.builtin.command: vault status -format=json
      environment:
        VAULT_ADDR: "https://127.0.0.1:8200"
        VAULT_CACERT: /opt/vault/tls/vault-ca.pem
      register: __case_status
      changed_when: false
      failed_when: __case_status['rc'] != 2

    - name: Stat controller init file
      ansible.builtin.stat:
        path: /tmp/.vault_init_molecule_negative.json
      delegate_to: localhost
      become: false
      register: __case_init_file

    - name: Assert Vault is initialized, sealed and the init file exists
      ansible.builtin.assert:
        that:
          - (__case_status['stdout'] | from_json)['initialized'] | bool
          - (__case_status['stdout'] | from_json)['sealed'] | bool
          - __case_init_file['stat']['exists']

# ------------------------------------------------------------------------------
# Case 2 (V-04): a leader that never reaches unsealed must fail the wait gate.
# Init used threshold 2; submitting only 1 share is accepted by the unseal API
# but leaves Vault sealed.
# ------------------------------------------------------------------------------
- name: Case 2 - never-unsealing leader fails the wait gate
  hosts: all
  become: true
  gather_facts: false
  vars:
    vault_init: true
    vault_unseal: true
    vault_init_key_threshold: 1
  tasks:
    - name: Run the role and capture the failure
      block:
        - name: Include hashicorp_vault role
          ansible.builtin.include_role:
            name: ansible-role-hashicorp-vault

        - name: Fail when the role did not fail
          ansible.builtin.fail:
            msg: "The role passed although the leader stayed sealed"
      rescue:
        - name: Assert the leader wait gate failed
          ansible.builtin.assert:
            that:
              - ansible_failed_task['name'] == 'Wait for leader to report unsealed status (Shamir)'
            fail_msg: "Unexpected failed task: {{ ansible_failed_task['name'] }}"
