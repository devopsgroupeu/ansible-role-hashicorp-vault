---
# Converge for the upgrade scenario. vault_version is the old version unless
# MOLECULE_VAULT_UPGRADE_VERSION is set (side_effect_upgrade.yml sets it to the
# target version).

- name: Converge
  hosts: all
  become: true
  gather_facts: true
  vars:
    vault_version: "{{ lookup('ansible.builtin.env', 'MOLECULE_VAULT_UPGRADE_VERSION') | default('2.0.4', true) }}"

    vault_init: true
    vault_unseal: true
    vault_audit_enabled: true
    vault_init_key_shares: 1
    vault_init_key_threshold: 1
    vault_init_encrypt_output: false
    vault_init_output_path: "/tmp/.vault_init_molecule_upgrade.json"

    vault_disable_mlock: true
    vault_manage_swap: false
    vault_tls_generate_certs: true
    vault_tls_install_ca_to_trust_store: false
    vault_api_addr: "https://127.0.0.1:8200"
    vault_cluster_addr: "https://127.0.0.1:8201"
    vault_raft_peers:
      - hashicorp-vault-upgrade

  tasks:
    - name: Include hashicorp_vault role
      ansible.builtin.include_role:
        name: ansible-role-hashicorp-vault
