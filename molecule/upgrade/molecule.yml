---
# upgrade scenario - single node package upgrade of a running, unsealed Vault.
# converge installs and initializes the old version; the side effect converges
# again with the new version and must restart Vault onto it and re-unseal it.

dependency:
  name: galaxy

driver:
  name: docker

platforms:
  - name: hashicorp-vault-upgrade
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian12}-ansible:latest"
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: ""
    groups:
      - vault

provisioner:
  name: ansible
  playbooks:
    side_effect: side_effect_upgrade.yml
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
  config_options:
    defaults:
      interpreter_python: auto_silent
      callbacks_enabled: profile_tasks, timer
      stdout_callback: default
    ssh_connection:
      pipelining: false
  inventory:
    hosts:
      all:
        vars:
          ansible_user: root

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - side_effect side_effect_upgrade.yml
    - verify
    - cleanup
    - destroy
