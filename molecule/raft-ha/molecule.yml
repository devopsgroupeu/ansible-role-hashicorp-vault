---
# raft-ha scenario — 3-node Raft integrated-storage cluster.
#
# All three platforms share a named Docker network ('vault-raft') so that
# container hostnames resolve via Docker's embedded DNS. The network is declared
# under each platform so molecule-plugins creates it before the first container
# starts. Using a shared network is the only reliable way to make retry_join
# hostname resolution work between containers.
#
# The test sequence runs converge, idempotence (a second full run must report
# changed=0 on all nodes), a --limit vault2 re-run (side_effect_limit.yml, must
# not rewrite retry_join or SANs), a restart of every node followed by a
# converge (side_effect_restart.yml, must keep the token and verify the Raft
# peers), a stopped vault3 (side_effect_peer_down.yml, must name the peer, and
# converge the survivors only with vault_allow_unreachable_peers) and verify.
# Run manually with:
#   molecule test -s raft-ha
# CI runs it on pull requests to main and via workflow_dispatch (see
# .github/workflows/ci.yml).

dependency:
  name: galaxy

driver:
  name: docker

platforms:
  - name: vault1
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian12}-ansible:latest"
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: ""
    groups:
      - vault
    networks:
      - name: vault-raft

  - name: vault2
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian12}-ansible:latest"
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: ""
    groups:
      - vault
    networks:
      - name: vault-raft

  - name: vault3
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian12}-ansible:latest"
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: ""
    groups:
      - vault
    networks:
      - name: vault-raft

provisioner:
  name: ansible
  playbooks:
    side_effect: side_effect_limit.yml
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
  config_options:
    defaults:
      interpreter_python: auto_silent
      callbacks_enabled: profile_tasks, timer
      stdout_callback: default
    ssh_connection:
      pipelining: false
  inventory:
    hosts:
      all:
        vars:
          ansible_user: root

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - side_effect side_effect_limit.yml
    - side_effect side_effect_restart.yml
    - side_effect side_effect_peer_down.yml
    - verify
    - cleanup
    - destroy
